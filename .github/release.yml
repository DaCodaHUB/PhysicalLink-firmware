
name: Release PhysicalLink Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Validate release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python -c \
            "import json; print(json.load(open('library.json'))['version'])")

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: $GITHUB_REF_NAME"
            exit 1
          fi

          if [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Tag and library.json version do not match"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package library
        run: |
          mkdir -p dist
          pio pkg pack -o "dist/PhysicalLink-${VERSION}.tar.gz"

      - name: Verify package and generate checksum
        shell: bash
        run: |
          tar -tzf "dist/PhysicalLink-${VERSION}.tar.gz" > dist/contents.txt
          grep -q 'library.json' dist/contents.txt
          grep -q 'PhysicalLink.h' dist/contents.txt

          cd dist
          sha256sum "PhysicalLink-${VERSION}.tar.gz" > SHA256SUMS.txt

      - name: Create GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/PhysicalLink-${VERSION}.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "PhysicalLink ${VERSION} Beta" \
            --prerelease \
            --generate-notes
