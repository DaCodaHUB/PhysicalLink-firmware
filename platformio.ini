[platformio]
default_envs = real-sensors
src_dir = examples

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    PhysicalLink=symlink://.

[env:real-sensors]
build_src_filter = -<*> +<real_sensors/main.cpp>

[env:basic]
build_src_filter = -<*> +<basic/main.cpp>

[env:stress-test]
build_src_filter = -<*> +<stress_test/main.cpp>
